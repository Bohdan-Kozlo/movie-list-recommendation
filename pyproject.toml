[project]
name = "movie-list-recommendation"
version = "0.1.0"
description = "A reproducible movie and TV-series recommendation system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17,<2.0",
  "authlib>=1.6,<1.8",
  "fastapi[standard]>=0.115,<1.0",
  "itsdangerous>=2.2,<3.0",
  "ollama>=0.6.2",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pyjwt>=2.10,<3.0",
  "qdrant-client>=1.19.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
recsys = "recsys.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.uv.build-backend]
module-name = "recsys"
module-root = "ml"
namespace = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "ml/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "ml"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "recsys", "test_recommendations_application"]

[tool.mypy]
files = ["apps/api/app", "ml/recsys"]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = ["apps/api", "ml"]
